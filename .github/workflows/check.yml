name: check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dist/ is up to date with src/
        run: python3 build.py --check
      - name: Stack checker runs
        run: python3 dist/codex/.agents/skills/stack-check/scripts/check_stack.py . --json > /dev/null
      - name: Installer round-trip
        run: |
          mkdir -p /tmp/proj
          python3 install.py /tmp/proj
          python3 install.py /tmp/proj
          test "$(grep -c 'enterprise-arch-kit:start' /tmp/proj/AGENTS.md)" = 1
          python3 install.py /tmp/proj --uninstall
          test ! -e /tmp/proj/AGENTS.md
