name: check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: dist/ is up to date with src/
        run: python3 build.py --check
      - name: Test-first guard and gates
        run: python3 -m unittest discover tests -v
      - name: Stack checker runs
        run: python3 dist/codex/.agents/skills/stack-check/scripts/check_stack.py . --json > /dev/null
      - name: Installer round-trip
        run: |
          mkdir -p /tmp/proj/.claude/skills/install /tmp/own/.claude/skills/install
          printf '# Install — get ready to build\n' > /tmp/proj/.claude/skills/install/SKILL.md
          printf '# Our own install skill\n' > /tmp/own/.claude/skills/install/SKILL.md
          python3 install.py /tmp/proj
          python3 install.py /tmp/proj
          test "$(grep -c 'enterprise-arch-kit:start' /tmp/proj/AGENTS.md)" = 1
          test ! -e /tmp/proj/.claude/skills/install
          python3 install.py /tmp/own
          test -f /tmp/own/.claude/skills/install/SKILL.md
          python3 install.py /tmp/proj --uninstall
          test ! -e /tmp/proj/AGENTS.md

  starter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Spec Kit CLI
        run: pip install specify-cli==1.1.3
      - name: starter/ is up to date with the kit
        run: python3 make_starter.py --check
      - name: A project created from the starter works
        run: |
          cp -r starter /tmp/vibe && cd /tmp/vibe
          git init -q -b main && git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm "from template"
          python3 -c "import json; json.load(open('.devcontainer/devcontainer.json'))"
          test ! -e .claude/skills/install && test ! -e .agents/skills/install
          grep -q "There is no setup step for the builder" AGENTS.md
          grep -q "hook test-writer" .claude/agents/test_writer.md
          grep -q "hook implementer" .claude/agents/implementer.md
          test -f .codex/agents/test_writer.toml && test -f .codex/agents/implementer.toml
          test "$(grep -l 'Enterprise Rules' .claude/skills/speckit-*/SKILL.md | wc -l)" = 6
          test "$(grep -l 'Enterprise Rules' .agents/skills/speckit-*/SKILL.md | wc -l)" = 6
          spec=$(bash .specify/scripts/bash/create-new-feature.sh --json "CI feature" | tail -1 | python3 -c "import json,sys; print(json.load(sys.stdin)['SPEC_FILE'])")
          grep -q "Business Context" "$spec"

  speckit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Spec Kit CLI
        run: pip install specify-cli
      - name: Install kit with Spec Kit preset (Claude Code + Codex)
        run: |
          mkdir -p /tmp/sk && git -C /tmp/sk init -q
          python3 install.py /tmp/sk --speckit
          for d in .claude/skills .agents/skills; do
            for s in specify clarify plan tasks implement constitution; do
              grep -q "Enterprise Rules" "/tmp/sk/$d/speckit-$s/SKILL.md"
            done
          done
          grep -q "Business decides what, agents decide how" /tmp/sk/.specify/memory/constitution.md
      - name: Templates compose at runtime
        run: |
          cd /tmp/sk
          git -c user.name=ci -c user.email=ci@example.com commit -qm init --allow-empty
          spec=$(bash .specify/scripts/bash/create-new-feature.sh --json "CI feature" | tail -1 | python3 -c "import json,sys; print(json.load(sys.stdin)['SPEC_FILE'])")
          grep -q "Business Context" "$spec"
      - name: Uninstall restores core Spec Kit skills
        run: |
          python3 install.py /tmp/sk --uninstall
          for f in /tmp/sk/.claude/skills/speckit-plan/SKILL.md /tmp/sk/.agents/skills/speckit-plan/SKILL.md; do
            if grep -q "Enterprise Rules" "$f"; then echo "preset still present in $f"; exit 1; fi
          done
