name = "readability_reviewer"
description = "Read-only code readability reviewer based on The Pragmatic Programmer (ETC, DRY, orthogonality, decoupling, naming, crash early). Returns the few highest-value findings with file:line and concrete suggestions. Use after code is implemented, before a commit or PR, or when asked about readability or maintainability."
skills = ["readability-review"]

